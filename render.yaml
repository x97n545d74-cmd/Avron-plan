# Render blueprint: one background worker that runs the Avron writer.
services:
  - type: worker
    name: avron-writer
    runtime: python
    plan: starter
    branch: avron-x-merger
    # Redeploy only when the worker itself changes. Without this filter every new
    # headline or posted-log commit on the branch would restart the worker.
    buildFilter:
      paths:
        - render.yaml
        - render/**
    buildCommand: "true"
    startCommand: bash render/worker.sh
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
